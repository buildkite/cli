agents:
  queue: hosted

cache: ".buildkite/cache-volume"

steps:
  - name: ":golangci-lint: lint"
    key: lint
    command: 'golangci-lint run --verbose --timeout 3m'
    secrets:
      - MISE_GITHUB_TOKEN
    plugins:
      - mise#v1.1.6: ~

  - name: ":go: test"
    key: test
    artifact_paths:
      - cover-tree.svg
    secrets:
      - MISE_GITHUB_TOKEN
    commands:
      # Hosted agents inject org/token env that breaks config-precedence tests,
      # so clear those variables in the command shell right before go test.
      - unset BUILDKITE_ORGANIZATION_SLUG BUILDKITE_API_TOKEN
      - go test -coverprofile cover.out ./...
      - go-cover-treemap -coverprofile cover.out > cover-tree.svg
      - echo '<details><summary>Coverage tree map</summary><img src="artifact://cover-tree.svg" alt="Test coverage tree map" width="70%"></details>' | buildkite-agent annotate --style "info"
    plugins:
      - mise#v1.1.6: ~

  - name: ":lock: govulncheck"
    key: vulncheck
    secrets:
      - MISE_GITHUB_TOKEN
    command: 'mise run vulncheck'
    plugins:
      - mise#v1.1.6: ~

  - label: ":terminal: build"
    key: build
    depends_on: ["lint", "test", "vulncheck", "release_check"]
    artifact_paths:
      - dist/**/*
    env:
      MISE_ENV: release
    secrets:
      - POSTHOG_API_KEY
      - OAUTH_CLIENT_ID
    command: '.buildkite/release.sh release --clean --snapshot'
    plugins:
      - mise#v1.1.6: ~

  - label: ":memo: Validate release"
    key: release_check
    commands:
      - go test ./.buildkite
      - .buildkite/release-pr.sh check
    env:
      MISE_ENV: release
    secrets:
      - MISE_GITHUB_TOKEN
    plugins:
      - mise#v1.1.6: ~

  # A group condition also prevents release credential plugins running on PRs.
  - group: ":rocket: Release from main"
    if: build.branch == "main" && build.pull_request.id == null && build.tag == null
    steps:
      - label: ":rocket: Tag reviewed release"
        key: tag_release
        command: ".buildkite/release-pr.sh tag"
        depends_on: ["lint", "test", "vulncheck", "build", "release_check"]
        concurrency: 1
        concurrency_group: buildkite-cli/tag-release
        env:
          AWS_REGION: us-east-1
          MISE_ENV: release
        plugins:
          - aws-assume-role-with-web-identity#v1.8.2:
              role-arn: arn:aws:iam::445615400570:role/pipeline-buildkite-buildkite-cli
              session-tags:
                - organization_slug
                - organization_id
                - pipeline_slug
          - aws-ssm#v1.1.0:
              parameters:
                GITHUB_TOKEN: /pipelines/buildkite/buildkite-cli/github-token
          - mise#v1.1.6: ~
